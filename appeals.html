<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>申诉</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="brand">
      <span class="brand-mark">宪</span>
      <div>
        <h1 data-brand="ORG_NAME" style="font-size:21px">云南工业信息职业学院</h1>
        <p data-brand="EVENT_NAME">第二届“学宪法 讲宪法”校园知识竞赛</p>
      </div>
    </div>
    <nav class="header-nav">
      <span class="user-chip" id="userChip">选手</span>
      <button type="button" id="logoutBtn">退出登录</button>
    </nav>
  </div>
</header>

<aside class="side-rail">
  <div class="side-title">功能菜单</div>
  <a class="side-item" href="home.html"><span class="ico">▦</span>选手中心</a>
  <a class="side-item" href="practice.html"><span class="ico">✎</span>在线练习</a>
  <a class="side-item" href="leaderboard.html"><span class="ico">☰</span>排行榜</a>
  <a class="side-item active" href="appeals.html"><span class="ico">✉</span>异议申诉</a>
  <a class="side-item" href="profile.html"><span class="ico">☻</span>个人中心</a>
</aside>

<main class="wrap player-main" style="max-width:860px">
  <h2 class="page-title">异议申诉</h2>
  <p class="page-sub">对题目内容或分数判定有异议，可在线提交；组委会审核后在此回复。</p>

  <div class="card">
    <div class="card-title">提交申诉</div>
    <form id="appealForm">
      <div class="grid-2">
        <div class="field">
          <label>选择竞赛 <span class="req">*</span></label>
          <select id="aComp"></select>
        </div>
        <div class="field">
          <label>申诉类型 <span class="req">*</span></label>
          <select id="aKind">
            <option value="question">题目异议（题干 / 答案 / 解析）</option>
            <option value="score">分数异议（判分有误）</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>关联答卷</label>
        <input type="text" id="aAttempt" readonly placeholder="从成绩页跳转时自动带入">
      </div>
      <div class="field">
        <label>异议说明 <span class="req">*</span></label>
        <textarea id="aContent" rows="4" placeholder="请写明题号、你的疑问与依据，至少 5 个字"></textarea>
      </div>
      <div class="field appeal-shot">
        <label>截图佐证（可选，限 2MB 以内）</label>
        <input type="file" id="aShot" accept="image/*">
        <img class="preview" id="shotPreview" hidden>
        <div class="shot-name" id="shotName"></div>
      </div>
      <button type="submit" class="btn">提交申诉</button>
    </form>
  </div>

  <div class="card" style="margin-top:18px">
    <div class="card-title">我的申诉记录</div>
    <div id="appealList"><div class="empty-state" style="padding:20px">暂无申诉</div></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/appeals.js"></script>
</body>
</html>
