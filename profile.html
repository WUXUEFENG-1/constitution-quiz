<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>个人中心</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/css/style.css?v=20261118">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="brand">
      <span class="brand-mark">宪</span>
      <div>
        <h1 data-brand="ORG_NAME" style="font-size:21px">云南工业信息职业学院</h1>
        <p data-brand="EVENT_NAME">第二届“学宪法 讲宪法”校园知识竞赛</p>
      </div>
    </div>
    <nav class="header-nav">
      <span class="user-chip" id="userChip">选手</span>
      <button type="button" id="logoutBtn">退出登录</button>
    </nav>
  </div>
</header>

<aside class="side-rail">
  <div class="side-title">功能菜单</div>
  <a class="side-item" href="home.html"><span class="ico">▦</span>选手中心</a>
  <a class="side-item" href="practice.html"><span class="ico">✎</span>在线练习</a>
  <a class="side-item" href="appeals.html"><span class="ico">✉</span>异议申诉</a>
  <a class="side-item active" href="profile.html"><span class="ico">☻</span>个人中心</a>
</aside>

<main class="wrap player-main">
  <h2 class="page-title">个人中心</h2>
  <p class="page-sub">个人信息、修改密码、历史成绩、我的证书</p>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="info">个人信息</button>
    <button class="tab" data-tab="password">修改密码</button>
    <button class="tab" data-tab="history">历史成绩</button>
    <button class="tab" data-tab="certs">我的证书</button>
  </div>

  <section id="panel-info">
    <div class="card" style="max-width:640px">
      <form id="infoForm">
        <div class="grid-2">
          <div class="field"><label>姓名</label><input type="text" id="pName" disabled></div>
          <div class="field"><label>学号</label><input type="text" id="pNo" disabled></div>
        </div>
        <div class="grid-2">
          <div class="field"><label>二级学院 / 系部</label><select id="pDept"></select></div>
          <div class="field"><label>班级</label><input type="text" id="pClass"></div>
        </div>
        <div class="field"><label>手机号</label><input type="tel" id="pPhone" maxlength="11"></div>
        <button type="submit" class="btn">保存信息</button>
      </form>
    </div>
  </section>

  <section id="panel-password" hidden>
    <div class="card" style="max-width:640px">
      <form id="pwdForm">
        <div class="field"><label>原密码 <span class="req">*</span></label><input type="password" id="oldPwd" required></div>
        <div class="grid-2">
          <div class="field"><label>新密码 <span class="req">*</span></label><input type="password" id="newPwd" required></div>
          <div class="field"><label>确认新密码 <span class="req">*</span></label><input type="password" id="newPwd2" required></div>
        </div>
        <button type="submit" class="btn">确认修改密码</button>
      </form>
    </div>
  </section>

  <section id="panel-history" hidden>
    <div class="card">
      <div class="table-wrap">
        <table class="data">
          <thead><tr><th>赛事</th><th>得分</th><th>总分</th><th>正确</th><th>正确率</th><th>用时</th><th>交卷时间</th><th>操作</th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section id="panel-certs" hidden>
    <div id="certList"></div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/profile.js"></script>
</body>
</html>
