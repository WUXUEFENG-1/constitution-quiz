<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>选手中心 · <span data-brand="EVENT_SHORT"></span></title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="brand">
      <span class="brand-mark">宪</span>
      <div>
        <h1 data-brand="ORG_NAME">云南工业信息职业学院</h1>
        <p data-brand="EVENT_NAME">第二届“学宪法 讲宪法”校园知识竞赛</p>
        <div class="brand-sub-unit">主办单位：<span data-brand="HOST_UNIT"></span></div>
        <div class="brand-sub-unit">承办单位：<span data-brand="ORGANIZER_UNIT"></span></div>
      </div>
    </div>
    <nav class="header-nav">
      <a href="home.html">选手中心</a>
      <a href="practice.html">在线练习</a>
      <a href="leaderboard.html">排行榜</a>
      <a href="appeals.html">申诉</a>
      <span class="user-chip" id="userChip">选手</span>
      <button type="button" id="logoutBtn">退出登录</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <h2 class="page-title">选手中心</h2>
  <p class="page-sub" id="welcomeLine">欢迎你，请完成报名后在开放时间内参赛。</p>

  <section class="grid-2" style="margin-bottom:18px">
    <div class="card" style="margin:0">
      <div class="card-title">参赛信息 <span class="right" id="regStatus"></span></div>
      <div class="kv" id="profileBox"></div>
      <div class="btn-row" style="margin-top:14px" id="regAction"></div>
    </div>
    <div class="card" style="margin:0">
      <div class="card-title">我的消息 <span class="right" id="msgCount"></span></div>
      <div id="msgList"><div class="empty-state" style="padding:20px">暂无消息</div></div>
    </div>
  </section>

  <section class="hub-grid" style="margin-bottom:18px" id="hubGrid"></section>

  <section class="grid-2">
    <div class="card" style="margin:0">
      <div class="card-title">赛事列表</div>
      <div id="compList"><div class="empty-state" style="padding:20px">暂无赛事</div></div>
    </div>
    <div class="card" style="margin:0">
      <div class="card-title">公告与规则</div>
      <div id="annList"><div class="empty-state" style="padding:20px">暂无公告</div></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <span class="foot-main" data-brand="FOOTER_MAIN"></span>
  <span class="foot-sub">技术支持：<span data-brand="SUPPORT_UNIT"></span></span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/home.js"></script>
</body>
</html>
