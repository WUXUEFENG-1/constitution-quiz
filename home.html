<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>选手中心</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="brand">
      <span class="brand-mark">宪</span>
      <div>
        <h1 data-brand="ORG_NAME" style="font-size:21px">云南工业信息职业学院</h1>
        <p data-brand="EVENT_NAME">第二届“学宪法 讲宪法”校园知识竞赛</p>
      </div>
    </div>
    <nav class="header-nav">
      <span class="user-chip" id="userChip">选手</span>
      <button type="button" id="logoutBtn">退出登录</button>
    </nav>
  </div>
</header>

<aside class="side-rail">
  <div class="side-title">功能菜单</div>
  <a class="side-item active" href="home.html"><span class="ico">▦</span>选手中心</a>
  <a class="side-item" href="practice.html"><span class="ico">✎</span>在线练习</a>
  <a class="side-item" href="leaderboard.html"><span class="ico">☰</span>排行榜</a>
  <a class="side-item" href="appeals.html"><span class="ico">✉</span>异议申诉</a>
  <a class="side-item" href="profile.html"><span class="ico">☻</span>个人中心</a>
</aside>

<main class="wrap player-main">
  <h2 class="page-title">选手中心</h2>
  <p class="page-sub" id="welcomeLine">欢迎你，请完成报名后在开放时间内参赛。</p>

  <div class="carousel" id="carousel" hidden>
    <div class="carousel-track" id="carouselTrack"></div>
    <div class="carousel-dots" id="carouselDots"></div>
  </div>

  <section class="grid-2" style="margin-bottom:18px">
    <div class="card" style="margin:0">
      <div class="card-title">参赛信息 <span class="right" id="regStatus"></span></div>
      <div class="kv" id="profileBox"></div>
      <div class="btn-row" style="margin-top:14px" id="regAction"></div>
    </div>
    <div class="card" style="margin:0">
      <div class="card-title">通知公告</div>
      <div id="annList"><div class="empty-state" style="padding:20px">暂无公告</div></div>
    </div>
  </section>

  <section class="hub-grid" style="margin-bottom:18px" id="hubGrid"></section>

  <section>
    <div class="card" style="margin:0">
      <div class="card-title">赛事列表</div>
      <div id="compList"><div class="empty-state" style="padding:20px">暂无赛事</div></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/home.js"></script>
</body>
</html>
